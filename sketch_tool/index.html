<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Tool - Outline Master</title>
    <link rel="stylesheet" href="style.css?v=12">
    <link rel="stylesheet" href="effects.css">
    <style>


        @font-face {
            font-family: 'TW-Kai';
            src: url('fonts/TW-Kai-98_1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>


<body>
    <div class="studio-container">
        <header>
            <div class="header-group left">
                <h1>Sketch Tool</h1>
                <a href="app_demo/index.html" class="preview-btn" target="_blank">預覽遊戲卡牌</a>
                <input type="file" id="imageLoader" accept="image/*" style="display: none;">
            </div>

            <div class="header-group center">
                <button id="loadWorkspaceBtn">切換工作區</button>
                <div class="tool-group">
                    <button id="toggleBgBtn" class="layer-btn active">底圖</button>
                    <button id="toggleSketchBtn" class="layer-btn">手繪圖</button>
                    <button id="toggleComponentsBtn" class="layer-btn">部件</button>
                    <button id="toggleRegionsBtn" class="layer-btn active">紅框</button>
                    <button id="togglePreviewBtn" class="layer-btn primary">預覽 (Preview)</button>
                </div>
                <!-- 預覽步進器已移動至右側面板 -->
            </div>

            <div class="header-group right">
                <input type="text" id="charNameInput" placeholder="字名 (如: 聽)" style="display: none;">
            </div>
        </header>

        <main class="studio-main">
            <div id="workspaceCanvas">
                <!-- 實際畫布層 (Sheet Area)，通常小於並居中於工作區 -->
                <div class="canvas-layers">
                    <canvas id="bgCanvas"></canvas>
                    <canvas id="sketchCanvas"></canvas>
                    <canvas id="regionCanvas"></canvas>
                    <div id="textOverlayContainer"></div>
                </div>
            </div>

            <aside class="right-panel">
                <!-- 草圖工具組 -->
                <div class="panel-section" id="brushControls">
                    <h3>手繪工具 (Hand-drawn)</h3>
                    <div class="control-group">
                        <label>筆刷大小</label>
                        <input type="range" id="brushSize" min="1" max="50" value="3">
                    </div>
                    <div class="control-group">
                        <label>筆刷顏色</label>
                        <div class="color-grid" id="colorControls">
                            <div class="color-option active" data-color="#ffffff" style="background: #ffffff;"></div>
                            <div class="color-option" data-color="#888888" style="background: #888888;"></div>
                            <div class="color-option" data-color="#ff4444" style="background: #ff4444;"></div>
                            <div class="color-option" data-color="#000000" style="background: #000000; border: 1px solid #444;"></div>
                        </div>
                    </div>
                    <div class="control-group">
                        <button id="undoBtn" class="secondary w-full">上一步 (Undo)</button>
                        <button id="clearBtn" class="danger w-full mt-2">清除畫布</button>
                    </div>
                </div>

                <!-- 部件工具組 -->
                <div class="panel-section" id="componentControls">
                    <h3>部件屬性 (Component)</h3>
                    
                    <!-- 顯示模式 (一律顯示) -->
                        <div class="control-group">
                            <label>顯示模式 (Display Mode)</label>
                            <div class="tool-group" id="displayModeGroup">
                                <button id="showStructBtn" class="layer-btn">結構圖 (Struct)</button>
                                <button id="showInkBtn" class="layer-btn active">渲染圖 (Render)</button>
                            </div>
                        </div>

                    <div class="rotate-controls" style="display: none;" id="rotationPanel">
                        <div class="control-group">
                            <label>X 軸旋轉: <span id="valX">0</span>°</label>
                            <input type="range" id="rotateX" min="-180" max="180" value="0">
                        </div>
                        <div class="control-group">
                            <label>Y 軸旋轉: <span id="valY">0</span>°</label>
                            <input type="range" id="rotateY" min="-180" max="180" value="0">
                        </div>
                        <div class="control-group">
                            <label>Z 軸旋轉: <span id="valZ">0</span>°</label>
                            <input type="range" id="rotateZ" min="-180" max="180" value="0">
                        </div>
                        <div class="control-group mt-2">
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="isPhonetic"> 標記為聲符
                            </label>
                        </div>
                        <button id="resetRotationsBtn" class="secondary w-full mt-2">重設為平面</button>
                    </div>
                    <p id="noSelectionMsg" class="hint">請在畫面上選取一個部件來調整 3D 旋轉</p>
                </div>

                <!-- 底圖工具組 -->
                <div class="panel-section" id="bgControls">
                    <h3>底圖工具 (Background)</h3>
                    <div class="control-group">
                        <label>底圖透明度</label>
                        <input type="range" id="bgOpacityInput" min="0" max="100" value="50">
                    </div>
                    <div class="control-group mt-2">
                        <label class="file-label">
                            載入自定義底圖
                            <input type="file" id="imageLoader" accept="image/*">
                        </label>
                    </div>
                </div>
                
                <!-- 預覽控制組 (預設隱藏) -->
                <div class="panel-section" id="previewControls" style="display: none;">
                    <h3>預覽控制 (Preview Mode)</h3>
                    <div class="tool-group flex-col items-stretch gap-3">
                        <div class="flex justify-between items-center" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span id="stepIndicator" style="font-weight: 500;">Step 1 / 1</span>
                            <span id="partLabel" style="color: var(--accent-color); font-size: 0.85rem;"></span>
                        </div>
                        <div class="flex gap-2" style="display: flex; gap: 8px;">
                            <button id="prevStepBtn" class="secondary flex-1" style="flex: 1;">上一步</button>
                            <button id="nextStepBtn" class="primary flex-1" style="flex: 1;">下一步</button>
                        </div>
                    </div>
                </div>

            </aside>
        </main>
    </div>
    <div id="toastContainer"></div>

    <!-- 工作區選取彈窗 -->
    <div id="workspaceModal" class="modal-overlay">
        <div class="modal-content">
            <h2>切換工作區</h2>
            <div id="workspaceList" class="workspace-list">
                <!-- 由 JS 動態填充 -->
            </div>
            <div class="modal-actions">
                <button id="closeModalBtn">取消</button>
            </div>
        </div>
    </div>

    <script src="main.js?v=14"></script>
    <script src="sketch_layer.js?v=1"></script>
    <script src="component_layer.js?v=1"></script>
    <script src="region_layer.js?v=3"></script>
    <script src="preview_mode.js"></script>
    <script src="cli_control.js"></script>
</body>

</html>
